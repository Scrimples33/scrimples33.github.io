media:
  - name: posts
    label: Journal images
    input: src/assets/posts
    output: ../../assets/posts
  - name: artworks
    label: Artwork images
    input: src/assets/artworks
    output: ../../assets/artworks

content:
  - name: artworks
    label: Gallery artworks
    type: collection
    path: src/content/artworks
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, tags, date]
      sort: date
      direction: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: tags
        label: Tags
        type: string
        list:
          min: 1
        required: true
        description: "Which gallery tabs this picture appears under, e.g. Botanical. Use the names from 'Gallery tags'. The first tag sets its colour."
      - name: date
        label: Date finished
        type: date
        required: true
      - name: medium
        label: Medium
        type: string
        required: true
        description: "e.g. Colour pencil on pastel board"
      - name: size
        label: Size
        type: string
        required: false
        description: "e.g. A3 or 30 x 42 cm"
      - name: description
        label: About this piece
        type: text
        required: false
        description: "A few lines shown when someone clicks the picture"
      - name: image
        label: Photo of the artwork
        type: image
        required: true
        options:
          media: artworks
      - name: imageAlt
        label: Describe the picture
        type: string
        required: true
        description: "For people who can't see it, e.g. 'Red fox looking over its shoulder'"
      - name: featured
        label: Show on the home page
        type: boolean
        default: false
      - name: availability
        label: Availability
        type: select
        required: false
        default: nfs
        description: "Shown under the picture. 'Not for sale' shows nothing."
        options:
          values:
            - { value: available, label: Original available }
            - { value: sold, label: Sold }
            - { value: commission, label: Private commission }
            - { value: nfs, label: Not for sale }

  - name: tags
    label: Gallery tags
    type: file
    path: src/data/tags.json
    format: json
    list: true
    fields:
      - name: name
        label: Tag name
        type: string
        required: true
        description: "Shown as a tab on the gallery page. Tabs follow the order of this list. A tag with no pictures is hidden."
      - name: description
        label: Short description
        type: string
        required: false
        description: "Optional. Shown under the tag name on the gallery page, e.g. to explain the idea behind it. Leave blank for none."
      - name: colour
        label: Colour
        type: select
        required: true
        default: sage
        options:
          values:
            - { value: sage, label: "Sage green #7E9A72" }
            - { value: hen, label: "Hen russet #B5653A" }
            - { value: yolk, label: "Egg-yolk yellow #D9A441" }
            - { value: sky, label: "Duck-egg blue #5E9FA0" }
            - { value: blossom, label: "Blossom pink #D58A94" }
            - { value: moss, label: "Moss green #6F7F3A" }
            - { value: fern, label: "Fern green #4F8A5B" }
            - { value: mint, label: "Mint #6FB3A0" }
            - { value: teal, label: "Teal #2F8A86" }
            - { value: cornflower, label: "Cornflower blue #5B7FC0" }
            - { value: lavender, label: "Lavender #9A88C4" }
            - { value: heather, label: "Heather purple #8E5A86" }
            - { value: rose, label: "Rose red #B84A5A" }
            - { value: poppy, label: "Poppy red #D2553A" }
            - { value: apricot, label: "Apricot #E09A5B" }
            - { value: marigold, label: "Marigold orange #E07B28" }
            - { value: mustard, label: "Mustard #C4A93A" }
            - { value: bark, label: "Bark brown #8A6A4A" }
            - { value: chestnut, label: "Chestnut #9B4F2E" }
            - { value: slate, label: "Slate grey #6E7780" }
            - { value: stone, label: "Stone #A39A88" }

  - name: settings
    label: Site settings
    type: file
    path: src/data/settings.json
    format: json
    fields:
      - name: commissionsOpen
        label: Taking commissions
        type: boolean
        default: true
        description: "Tick when you are open for new commissions"
      - name: commissionsNote
        label: Commissions note
        type: string
        required: true
        description: "One line shown on the home and commissions pages, e.g. 'Currently booking, with a wait of about 6 weeks'"

  - name: posts
    label: Journal posts
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, draft]
      sort: date
      direction: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: summary
        label: Summary
        type: string
        required: true
        description: "One line, shown on cards and link previews"
      - name: cover
        label: Cover image
        type: image
        required: false
        options:
          media: posts
      - name: coverAlt
        label: Cover image description
        type: string
        required: false
        description: "Describe the image for people who can't see it. Needed if you add a cover."
      - name: tags
        label: Tags
        type: string
        list: true
        required: false
      - name: draft
        label: Draft
        type: boolean
        default: false
        description: "Drafts are saved but not shown on the site"
      - name: body
        label: Body
        type: rich-text
        required: false
